  <title id="title">GitHub activity under construction</title>
  <desc id="desc">A simple command prompt showing an under-construction message.</desc>

  <rect x="1" y="1" width="718" height="118" rx="4" fill="#0d0d0d" stroke="#777" stroke-width="2"/>

  <g fill="#eee" font-family="Consolas, 'Courier New', monospace" font-size="16">
    <text x="24" y="45">C:\&gt; github-activity</text>
